name: Testar uso remoto do CalculaAê

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Endereço do site publicado que será testado
        required: true
        default: https://calculaae.netlify.app
        type: string

permissions:
  contents: read

concurrency:
  group: vetta-remote-usage-test
  cancel-in-progress: true

jobs:
  usage-test:
    name: Barreira, senha e fluxo interno
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VETTA_TEST_BASE_URL: ${{ inputs.target_url }}
      VETTA_TEST_PASSWORD: ${{ secrets.VETTA_TEST_PASSWORD }}

    steps:
      - name: Baixar a fotografia escolhida
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirmar segredo de teste
        shell: bash
        run: |
          if [ -z "$VETTA_TEST_PASSWORD" ]; then
            echo "::error::Configure o segredo VETTA_TEST_PASSWORD no repositório antes de executar este teste."
            exit 1
          fi

      - name: Instalar dependência do navegador
        run: npm install --no-audit --no-fund

      - name: Instalar somente o Chromium
        run: npx playwright install --with-deps chromium

      - name: Testar barreira e uso interno
        run: npx playwright test

      - name: Guardar evidência somente em falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: falha-teste-uso-remoto
          path: |
            playwright-report/
            test-results/remote/
          if-no-files-found: ignore
          retention-days: 1
