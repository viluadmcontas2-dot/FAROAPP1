name: Manual FARO Release Verify
on:
  workflow_dispatch:
    inputs:
      release_gate:
        description: Release candidate identifier
        required: true
concurrency:
  group: faro-release-verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FARO_TEST_PGHOST: 127.0.0.1
      FARO_TEST_PGPORT: "5432"
      FARO_TEST_PGUSER: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Full governed checks
        run: npm run check
      - name: Release build audit
        run: |
          npm run build
          node tests/finance-v1-built-artifact-contract.test.mjs
      - name: Confirm no publication
        run: echo "Release verification completed without deployment."
