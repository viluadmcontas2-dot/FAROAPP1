name: Validar FARO v1 comercial

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-faro-v1-comercial
  cancel-in-progress: true

jobs:
  validar:
    name: Conferir onboarding e PWA sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar a fotografia da branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Node.js para os testes
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Conferir sintaxe e mostrar assinaturas dos arquivos
        shell: bash
        run: |
          node --check app.js
          node --check faro-brand.js
          node --check faro-onboarding.js
          node --check sw.js
          node --check scripts/build-netlify-of.mjs
          for arquivo in app-shell.html faro-onboarding.js sw.js; do
            assinatura="$(sha256sum "$arquivo" | cut -d ' ' -f 1)"
            echo "::notice file=$arquivo::SHA256 real: $assinatura"
          done

      - name: Conferir contrato e build do FARO
        run: npm run check

      - name: Confirmar que esta validação não publica o app
        run: echo "Validação concluída sem deploy ou publicação."
