name: Validar FARO v1 comercial

on:
  workflow_dispatch:
  pull_request:
    branches:
      - test/ux-r2-00-composition-contracts

permissions:
  contents: read

concurrency:
  group: validar-faro-v1-comercial
  cancel-in-progress: true

jobs:
  validar:
    name: Conferir onboarding e PWA sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar a fotografia exata auditada
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Confirmar SHA auditado
        run: |
          echo "audit_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha || github.sha }}"

      - name: Preparar Node.js para os testes
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Conferir sintaxe dos arquivos alterados
        run: |
          node --check app.js
          node --check faro-brand.js
          node --check faro-platform.js
          node --check faro-energy.js
          node --check faro-onboarding.js
          node --check sw.js
          node --check scripts/build-netlify-of.mjs

      - name: Conferir contrato e build do FARO
        run: npm run check

      - name: Confirmar que esta validação não publica o app
        run: echo "Validação concluída sem deploy ou publicação."
