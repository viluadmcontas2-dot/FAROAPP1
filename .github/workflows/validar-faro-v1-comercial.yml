name: Validar FARO v1 comercial

on:
  workflow_dispatch:
  pull_request:
    branches:
      - test/ux-r2-00-composition-contracts

permissions:
  contents: read

concurrency:
  group: validar-faro-v1-comercial-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Conferir onboarding e PWA sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FARO_AUDIT_REF: ${{ startsWith(github.head_ref, 'audit/runtime-contracts-') && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Baixar a fotografia auditada
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.FARO_AUDIT_REF }}

      - name: Confirmar SHA auditado
        run: |
          echo "audit_sha=$(git rev-parse HEAD)"
          echo "expected_sha=$FARO_AUDIT_REF"
          test "$(git rev-parse HEAD)" = "$FARO_AUDIT_REF"

      - name: Preparar Node.js para os testes
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Conferir sintaxe dos arquivos alterados
        run: |
          node --check app.js
          node --check faro-brand.js
          node --check faro-platform.js
          node --check faro-energy.js
          node --check faro-onboarding.js
          node --check sw.js
          node --check scripts/build-netlify-of.mjs

      - name: Conferir contratos do FARO
        run: npm run check

      - name: Smoke live N5 no Supabase (temporário, sem deploy)
        run: node tests/live-supabase-auth-smoke.mjs

      - name: Construir e auditar artefato FARO
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT_REF: ${{ env.FARO_AUDIT_REF }}
        run: |
          npm run build
          node tests/finance-v1-built-artifact-contract.test.mjs

      - name: Reter fotografia auditada para hosting
        uses: actions/upload-artifact@v4
        with:
          name: faro-financeiro-site
          path: _site
          if-no-files-found: error
          retention-days: 1

      - name: Confirmar que esta validação não publica o app
        run: echo "Validação concluída sem deploy ou publicação."
