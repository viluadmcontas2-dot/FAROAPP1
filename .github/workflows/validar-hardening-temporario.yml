name: Validar agora — integridade e composição FARO

on:
  push:
    branches:
      - release/faro-v1-comercial-22-08
    paths:
      - VALIDAR_HARDENING

permissions:
  contents: read

jobs:
  validar:
    name: Conferir dados e composição sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar fotografia remota
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Conferir sintaxe dos módulos novos
        run: |
          node --check faro-state.js
          node --check faro-platform.js
          node --check sw.js
      - name: Conferir todos os contratos e build
        run: npm run check
      - name: Confirmar ausência de publicação explícita
        run: echo "Hardening validado sem deploy explícito."
