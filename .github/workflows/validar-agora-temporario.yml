name: Validar agora — fotografia FARO completa

on:
  push:
    branches:
      - release/faro-v1-comercial-22-08
    paths:
      - VALIDAR_AGORA

permissions:
  contents: read

concurrency:
  group: validar-agora-faro-completo
  cancel-in-progress: true

jobs:
  validar:
    name: Conferir fotografia completa sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar a fotografia da branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Node.js para os testes
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Conferir sintaxe dos módulos principais
        run: |
          node --check app.js
          node --check faro-brand.js
          node --check faro-platform.js
          node --check faro-energy.js
          node --check faro-home.js
          node --check faro-register.js
          node --check faro-finance.js
          node --check faro-reserves.js
          node --check faro-navigation.js
          node --check faro-onboarding.js
          node --check faro-account.js
          node --check faro-notifications.js
          node --check sw.js
          node --check scripts/build-netlify-of.mjs

      - name: Conferir contratos e build do FARO
        run: npm run check

      - name: Confirmar que a validação não publica nada
        run: echo "Fotografia validada sem deploy ou publicação."
