name: Validar agora — fotografia FARO completa

on:
  push:
    branches:
      - release/faro-v1-comercial-22-08
    paths:
      - VALIDAR_AGORA

permissions:
  contents: read

concurrency:
  group: validar-agora-faro-completo
  cancel-in-progress: true

jobs:
  validar:
    name: Conferir fotografia completa sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar a fotografia da branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Node.js para os testes
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Conferir sintaxe dos módulos principais
        run: |
          node --check app.js
          node --check faro-brand.js
          node --check faro-platform.js
          node --check faro-energy.js
          node --check faro-home.js
          node --check faro-register.js
          node --check faro-finance.js
          node --check faro-reserves.js
          node --check faro-navigation.js
          node --check faro-onboarding.js
          node --check faro-account.js
          node --check faro-notifications.js
          node --check sw.js
          node --check scripts/build-netlify-of.mjs

      - name: Conferir núcleo, onboarding e PWA
        run: node tests/baseline-contract.test.mjs

      - name: Conferir gramática visual
        run: node tests/ui-grammar.test.mjs

      - name: Conferir Home e Faro do Dia
        run: node tests/home-contract.test.mjs

      - name: Registro — integração no app instalado
        run: |
          grep -Fq 'faro-register.js?v=1' app-shell.html
          grep -Fq 'faro-register.js?v=1' sw.js
          grep -Fq "'faro-register.js'" scripts/build-netlify-of.mjs

      - name: Registro — atalhos rápidos
        run: |
          grep -Fq '+ R$50' faro-register.js
          grep -Fq '+ R$100' faro-register.js
          grep -Fq '+ R$200' faro-register.js
          grep -Fq '+ 5 km' faro-register.js
          grep -Fq '+ 10 km' faro-register.js
          grep -Fq '+ 50 km' faro-register.js
          grep -Fq 'current + increment' faro-register.js

      - name: Registro — rascunho e retomada
        run: |
          grep -Fq "const DRAFT_KEY = 'faro-record-draft-v1'" faro-register.js
          grep -Fq 'localStorage.setItem(DRAFT_KEY' faro-register.js
          grep -Fq 'visibilitychange' faro-register.js
          grep -Fq 'editingExisting' faro-register.js

      - name: Registro — teclado e limpar coerente
        run: |
          grep -Fq "setAttribute('inputmode', 'decimal')" faro-register.js
          grep -Fq "$('clearDayButton')?.addEventListener" faro-register.js
          grep -Fq 'clearDraft();' faro-register.js

      - name: Registro — proteção de save e consequência financeira
        run: |
          grep -Fq 'if (saving) return' faro-register.js
          grep -Fq 'aria-busy' faro-register.js
          grep -Fq 'remainingWeek' faro-register.js
          grep -Fq 'Na semana, faltam' faro-register.js
          grep -Fq 'No mês, faltam' faro-register.js

      - name: Registro — sem motor financeiro paralelo
        run: |
          ! grep -Eq 'state\.records\.(push|splice)' faro-register.js
          ! grep -Eq 'dailyGross[[:space:]]*=|dailyNet[[:space:]]*=' faro-register.js

      - name: Conferir contrato completo do Registro
        run: node tests/register-contract.test.mjs

      - name: Conferir vencimentos e Planejar
        run: node tests/finance-contract.test.mjs

      - name: Conferir reservas reais
        run: node tests/reserves-contract.test.mjs

      - name: Conferir Histórico e navegação
        run: node tests/navigation-contract.test.mjs

      - name: Conferir conta, sincronização e assinatura
        run: node tests/account-contract.test.mjs

      - name: Conferir avisos úteis
        run: node tests/notifications-contract.test.mjs

      - name: Conferir build final
        run: npm run build

      - name: Confirmar que a validação não publica nada
        run: echo "Fotografia validada sem deploy ou publicação."
