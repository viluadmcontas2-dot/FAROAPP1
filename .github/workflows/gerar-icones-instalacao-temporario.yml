name: Gerar ícones de instalação do FARO

on:
  push:
    branches:
      - release/faro-v1-comercial-22-08
    paths:
      - GERAR_ICONES_INSTALACAO

permissions:
  contents: write

jobs:
  gerar:
    name: Criar ícones 192 e 512 da marca FARO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar a fotografia da branch
        uses: actions/checkout@v7
        with:
          ref: release/faro-v1-comercial-22-08
          fetch-depth: 1

      - name: Preparar conversor da marca
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Gerar os dois tamanhos oficiais
        run: |
          python - <<'PY'
          import struct
          import cairosvg

          for size in (192, 512):
              path = f'icon-{size}.png'
              cairosvg.svg2png(url='icon.svg', write_to=path, output_width=size, output_height=size)
              with open(path, 'rb') as f:
                  header = f.read(24)
              assert header[:8] == b'\x89PNG\r\n\x1a\n'
              width, height = struct.unpack('>II', header[16:24])
              assert (width, height) == (size, size), (path, width, height)
              print(f'{path}: {width}x{height}')
          PY

      - name: Salvar os ícones na branch comercial
        run: |
          git config user.name "FARO — automação de ativos"
          git config user.email "actions@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if git diff --cached --quiet; then
            echo "Ícones já estavam corretos."
          else
            git commit -m "Adicionar ícones oficiais de instalação do FARO"
            git push origin HEAD:release/faro-v1-comercial-22-08
          fi
