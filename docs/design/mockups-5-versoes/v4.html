<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FARO Conversa</title>
<style>
:root{--bg:#fff;--soft:#F3F7F7;--line:#E1E8E8;--ink:#17292A;--mute:#586968;--teal:#0E7C7B;--teal-d:#0A5E5D;--teal-s:#E2F3F2;--warn:#8A5A00;--warn-s:#FFF4DB;--err:#B3261E;--err-s:#FDECEA;--ok:#17703F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:500;color:var(--ink);background:#E9EFEF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #0B5FFF;outline-offset:2px;border-radius:10px}
#idx{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
#idx select{font:inherit;font-size:14px;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 0 0 10px #1c2b2b,0 30px 60px rgba(0,0,0,.25);overflow:hidden}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:28px 16px 24px;scrollbar-width:none}
#view.nav{bottom:76px;padding-bottom:40px}
#view::-webkit-scrollbar{display:none}
h1{font-size:26px;line-height:1.2;font-weight:600;margin:0 0 8px;letter-spacing:-.3px}
h2{font-size:19px;font-weight:600;margin:0 0 6px}
p{margin:0 0 10px;line-height:1.45}
.mute{color:var(--mute)}
.small{font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:28px;background:var(--teal);color:#fff;font-weight:600;font-size:17px;padding:0 20px}
.btn:active{background:var(--teal-d)}
.btn.sec{background:var(--teal-s);color:var(--teal-d)}
.btn.ghost{background:none;color:var(--teal-d);min-height:48px;font-size:16px}
.btn.danger{background:var(--err);color:#fff}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1}
.bub{background:var(--soft);border-radius:20px 20px 20px 6px;padding:14px 16px;max-width:92%;margin:0 0 10px;line-height:1.4}
.bub.me{background:var(--teal-s);border-radius:20px 20px 6px 20px;margin-left:auto;color:var(--teal-d);font-weight:600}
.bub .lbl{font-size:13px;color:var(--mute);display:block;margin-bottom:2px}
.bub .big{font-size:40px;font-weight:600;letter-spacing:-1px;line-height:1.1;color:var(--ink)}
.bub.hero{width:92%;padding:18px}
.time{font-size:12px;color:var(--mute);text-align:center;margin:6px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{min-height:48px;padding:0 18px;border-radius:24px;border:1.5px solid var(--teal);color:var(--teal-d);font-weight:600;font-size:16px;background:#fff;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--teal);color:#fff}
.bar{height:12px;border-radius:6px;background:#D9E6E5;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.list{border:1.5px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:8px 16px;text-align:left;border-bottom:1.5px solid var(--line);font-size:17px}
.item:last-child{border-bottom:0}
.item .ic{width:40px;height:40px;border-radius:50%;background:var(--teal-s);display:grid;place-items:center;color:var(--teal-d);flex:none}
.item small{display:block;color:var(--mute);font-size:14px;font-weight:500}
.item .v{margin-left:auto;font-weight:600}
svg{display:block}
.hdr{display:flex;align-items:center;gap:6px;margin:-10px 0 14px;min-height:48px}
.hdr .ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink);margin-left:-10px}
.hdr .t{font-size:19px;font-weight:600}
.prog{display:flex;gap:6px;margin:0 0 6px}
.prog i{flex:1;height:6px;border-radius:3px;background:#D9E6E5}.prog i.on{background:var(--teal)}
.step{font-size:14px;color:var(--mute);margin-bottom:14px;font-weight:600}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:18px;padding:10px 16px;margin-bottom:10px;text-align:left;font-size:17px;background:#fff}
.opt.on{border-color:var(--teal);background:var(--teal-s);box-shadow:inset 0 0 0 1px var(--teal)}
.opt small{display:block;color:var(--mute);font-size:14px;font-weight:500}
.stp{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.stp button{width:64px;height:64px;border-radius:50%;background:var(--teal-s);color:var(--teal-d);display:grid;place-items:center}
.stp output{font-size:44px;font-weight:600;min-width:150px;text-align:center;letter-spacing:-1px}
.stp output small{font-size:16px;color:var(--mute);font-weight:500;letter-spacing:0}
.foot{position:sticky;bottom:-24px;background:linear-gradient(#fff0,#fff 24%);padding:18px 0 12px;margin-top:16px}
/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1.5px solid var(--line);display:none;align-items:center;justify-content:space-around;padding:0 4px}
#nav.show{display:flex}
#nav button{width:64px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute);border-radius:16px}
#nav button.on{color:var(--teal-d);font-weight:700}
#nav .gap{width:84px}
#fab{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:var(--teal);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;gap:1px;box-shadow:0 8px 20px rgba(14,124,123,.4);border:5px solid #fff;z-index:5}
#fab.show{display:flex}
/* keypad */
.val{font-size:46px;font-weight:600;text-align:right;letter-spacing:-1px;padding:4px 4px 2px;min-height:62px}
.val small{font-size:18px;color:var(--mute);font-weight:500}
.err{color:var(--err);font-size:14px;font-weight:600;min-height:20px;text-align:right;padding:0 4px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 10px}
.kp button{height:56px;border-radius:16px;background:var(--soft);font-size:26px;font-weight:600;display:grid;place-items:center}
.kp button:active{background:var(--teal-s)}
/* overlays */
#toast{position:absolute;left:16px;right:16px;bottom:100px;background:#17292A;color:#fff;border-radius:18px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:30;min-height:52px}
#toast.show{display:flex}
#toast button{color:#9FE8E4;font-weight:700;min-height:44px;padding:0 6px}
#banner{position:absolute;top:0;left:0;right:0;background:var(--warn-s);color:var(--warn);font-size:14px;font-weight:600;padding:8px 16px;z-index:20;display:none;align-items:center;gap:8px}
#banner.show{display:flex}
#ov{position:absolute;inset:0;background:rgba(10,30,30,.55);display:none;z-index:40}
#ov.show{display:block}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;border-radius:28px;padding:22px 18px 18px}
.tip{position:absolute;left:20px;right:20px;background:#fff;border-radius:20px;padding:16px}
.tip::after{content:"";position:absolute;width:18px;height:18px;background:#fff;transform:rotate(45deg);left:50%;margin-left:-9px}
.tip.up::after{top:-8px}.tip.down::after{bottom:-8px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#C7D6D5}.dots i.on{background:var(--teal)}
.inp{width:100%;min-height:56px;border:1.5px solid var(--line);border-radius:16px;padding:0 16px;font:inherit;font-size:18px;background:#fff;color:var(--ink)}
.badge{display:inline-block;background:var(--teal-s);color:var(--teal-d);border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700}
.days{display:flex;align-items:flex-end;gap:10px;height:120px;margin:6px 0}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--mute)}
.days b{display:block;width:100%;border-radius:8px 8px 4px 4px;background:#BFDCDA}.days .t b{background:var(--teal)}
.seg{display:flex;background:var(--soft);border-radius:24px;padding:4px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border-radius:20px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:var(--teal-d);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.empty{text-align:center;padding:40px 10px 10px}
.empty .ill{width:96px;height:96px;border-radius:50%;background:var(--teal-s);display:grid;place-items:center;margin:0 auto 18px;color:var(--teal-d)}
.sw{width:56px;height:32px;border-radius:16px;background:#B8C6C5;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--teal)}.sw.on::after{left:28px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.pill-warn{background:var(--warn-s);color:var(--warn)}
@media(max-width:500px){body{display:block;background:#fff}#idx{display:none}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<label id="idx">Ir para tela…
<select id="sel" aria-label="Ir para tela"></select></label>
<div class="phone" id="phone">
  <div id="banner" role="status"></div>
  <main id="view"></main>
  <nav id="nav" aria-label="Principal"></nav>
  <button id="fab" aria-label="Registrar"></button>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="ov"></div>
</div>
<script>
"use strict";
var $=function(s){return document.querySelector(s)};
var IC={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 hist:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',
 plan:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
 more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
 del:'<path d="M21 5H9l-6 7 6 7h12z"/><path d="M13 9.5l5 5M18 9.5l-5 5"/>',
 car:'<path d="M5 16l1.5-5.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 16M4 16h16v3H4zM7 19v1.5M17 19v1.5"/>',
 fuel:'<path d="M5 20V5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v15M3 20h13M14 9h2.5a1.5 1.5 0 0 1 1.5 1.5V16a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
 box:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
 trophy:'<path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 14v4M8 20h8"/>',
 card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 pig:'<path d="M5 11a7 6 0 0 1 14 0v1.5l2 .5v3l-2 .5V18h-3v-1.5H9V18H6v-3a5 5 0 0 1-1-4zM15 9h.01"/>',
 phone:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',
 wifi:'<path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0M12 19.5h.01"/>',
 share:'<path d="M12 15V3M8 7l4-4 4 4M5 12v8h14v-8"/>',
 spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
 flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
function ic(n,s,sw){s=s||24;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
function fmt(n){return 'R$ '+n.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function f0(n){return 'R$ '+Math.round(n)}
function hm(m){var h=Math.floor(m/60),r=m%60;return h+'h'+(r?(r<10?'0':'')+r:'')}
var S={ob:{veic:'Chevrolet Onix',meta:900,en:'Flex',kml:11.5,preco:6.29},
 hoje:{b:214,c:58.4,km:118,min:430,n:9},week:612,
 res:{'Manutenção':184,'Impostos':96,'Imprevistos':40},
 reg:{step:0,buf:['','','','']},undo:null,cur:'welcome',tour:0,tab:'sem',cupom:true,selFlow:'x'};
var NAVS={home:1,hist:1,plan:1,mais:1};
var SCREENS=[
 ['Entrada',[['welcome','1 Boas-vindas e oferta'],['install','2 Instalar o app'],['ob1','Passo 1 Veículo'],['ob2','Passo 2 Meta semanal'],['ob3','Passo 3 Tipo de energia'],['ob4','Passo 4 Consumo'],['ob5','Passo 5 Preço do combustível'],['ob6','Passo 6 Seu plano']]],
 ['Início',[['home','Início'],['homedet','Início com detalhes'],['homevazio','Início vazio'],['homeoff','Início sem internet']]],
 ['Registrar',[['reg0','Registrar: ganho bruto'],['reg1','Registrar: km'],['reg2','Registrar: horas'],['reg3','Registrar: combustível'],['regok','Registrar: confirmação'],['regerr','Registrar: erro']]],
 ['Histórico',[['hist','Semana'],['histmes','Mês'],['histdia','Detalhe do dia'],['histvazio','Vazio']]],
 ['Planejar',[['plan','Planejar']]],
 ['Mais',[['mais','Mais'],['reservas','Reservas'],['conq','Conquistas'],['conta','Conta e assinatura'],['comb','Preço do combustível'],['ajuda','Ajuda e dicas'],['priv','Privacidade e dados']]],
 ['Estados',[['toast','Aviso de sucesso'],['modal','Confirmar exclusão'],['tour','Tour de dicas'],['paywall','Fim do teste']]]
];
var sel=$('#sel');
SCREENS.forEach(function(g){var o=document.createElement('optgroup');o.label=g[0];g[1].forEach(function(s){var p=document.createElement('option');p.value=s[0];p.textContent=s[1];o.appendChild(p)});sel.appendChild(o)});
sel.onchange=function(){go(sel.value)};

function hdr(title,back,x){return '<div class="hdr">'+(back?'<button class="ib" data-go="'+back+'" aria-label="Voltar">'+ic('back')+'</button>':'')+'<span class="t">'+title+'</span><span class="sp"></span>'+(x?'<button class="ib" data-go="'+x+'" aria-label="Fechar" style="margin-right:-10px">'+ic('x')+'</button>':'')+'</div>'}
function steps(n){var s='';for(var i=1;i<=6;i++)s+='<i class="'+(i<=n?'on':'')+'"></i>';return '<div class="prog" aria-hidden="true">'+s+'</div><div class="step">Passo '+n+' de 6</div>'}
function foot(label,go,extra){return '<div class="foot"><button class="btn" '+(go?'data-go="'+go+'"':'')+' '+(extra||'')+'>'+label+'</button></div>'}

var R={};
R.welcome=function(){return '<div style="padding-top:20px"><div class="row" style="margin-bottom:26px"><div style="width:44px;height:44px;border-radius:14px;background:var(--teal);color:#fff;display:grid;place-items:center">'+ic('spark',26)+'</div><b style="font-size:22px;letter-spacing:1px">FARO</b></div>'+
 '<h1>Saiba quanto sobrou de verdade.</h1><p class="mute">Depois do combustível e das taxas. Sem planilha, só conversa.</p>'+
 '<div class="bub" style="margin-top:22px"><span class="lbl">Oferta</span><b style="font-size:19px">7 dias grátis</b><br>Depois R$ 22,99 por mês. Cancele quando quiser.</div>'+
 '<div class="bub"><span class="lbl">Cupom aplicado</span><span class="badge">PRAGAS</span></div></div>'+
 foot('Começar teste grátis','install')+'<button class="btn ghost" data-go="home">Já tenho conta</button>'};
R.install=function(){return hdr('Instalar o app','welcome')+
 '<h1>Deixe o FARO na tela inicial</h1><p class="mute">Abre em um toque, igual a um app.</p>'+
 '<div class="seg" role="tablist"><button class="'+(S.os!=='a'?'on':'')+'" data-act="os" data-v="i">iPhone</button><button class="'+(S.os==='a'?'on':'')+'" data-act="os" data-v="a">Android</button></div>'+
 (S.os==='a'?
 '<div class="bub">1. Toque nos <b>três pontos</b> do Chrome, no alto.</div><div class="bub">2. Toque em <b>Instalar app</b>.</div><div class="bub">3. Confirme em <b>Instalar</b>.</div>':
 '<div class="bub">1. Toque no botão <b>Compartilhar</b> '+ic('share',18)+' do Safari, embaixo.</div><div class="bub">2. Toque em <b>Adicionar à Tela de Início</b>.</div><div class="bub">3. Toque em <b>Adicionar</b>.</div>')+
 foot('Continuar','ob1')+'<button class="btn ghost" data-go="ob1">Instalar depois</button>'};
R.ob1=function(){var l=[['Chevrolet Onix','Flex, 1.0'],['Hyundai HB20','Flex, 1.0'],['Outro carro','Digitar depois']];
 return hdr('Seu carro','install')+steps(1)+'<h1>Qual carro você dirige?</h1>'+l.map(function(v){return '<button class="opt '+(S.ob.veic===v[0]?'on':'')+'" data-act="veic" data-v="'+v[0]+'"><span class="item" style="all:unset;display:contents"><span class="ic" style="width:40px;height:40px;border-radius:50%;background:var(--teal-s);display:grid;place-items:center;color:var(--teal-d)">'+ic('car')+'</span></span><span>'+v[0]+'<small>'+v[1]+'</small></span></button>'}).join('')+foot('Continuar','ob2')};
R.ob2=function(){return hdr('Sua meta','ob1')+steps(2)+'<h1>Quanto quer ganhar líquido por semana?</h1><p class="mute">Líquido é o que sobra depois dos gastos.</p><div class="stp"><button data-act="meta" data-v="-50" aria-label="Menos 50">'+ic('minus',28)+'</button><output id="metav">'+f0(S.ob.meta)+'</output><button data-act="meta" data-v="50" aria-label="Mais 50">'+ic('plus',28)+'</button></div><div class="chips" style="justify-content:center">'+[600,900,1200].map(function(v){return '<button class="chip '+(S.ob.meta===v?'on':'')+'" data-act="metaset" data-v="'+v+'">'+f0(v)+'</button>'}).join('')+'</div>'+foot('Continuar','ob3')};
R.ob3=function(){var l=[['Flex','Gasolina ou etanol'],['Gasolina','Só gasolina'],['Etanol','Só etanol'],['GNV','Gás natural']];

  case'metaset':S.ob.meta=+v;go('ob2');break;
  case'en':S.ob.en=v;go('ob3');break;
  case'kml':S.ob.kml=Math.max(5,Math.round((S.ob.kml+ +v)*10)/10);$('#kmlv').innerHTML=S.ob.kml.toFixed(1).replace('.',',')+'<small> km/l</small>';break;
  case'preco':S.ob.preco=Math.max(3,Math.round((S.ob.preco+ +v)*100)/100);$('#precov').textContent=fmt(S.ob.preco);break;
  case'precoset':S.ob.preco=6.29;go('ob5');break;
  case'k':if(v==='d')s.buf[st]=s.buf[st].slice(0,-1);else{var n=(s.buf[st]+v).replace(/^0+/,'');if(n.length<=(Q[st].mode==='int'?4:6))s.buf[st]=n}$('#err').textContent='';updVal();break;
  case'chip':s.buf[st]=Q[st].mode==='money'?String(Math.round(+v*100)):String(Math.round(+v));$('#err').textContent='';updVal();break;
  case'tm':s.min=Math.max(0,s.min+ +v);updVal();break;
  case'tmset':s.min=+v;updVal();break;
  case'rapido':s.buf=['21400','118','','5840'];s.min=430;go('regok');break;
  case'next':
   if(st===0&&!+s.buf[0]){$('#err').textContent='Digite quanto você ganhou. Toque nos números ou num atalho.';break}
   if(st===1&&!+s.buf[1]){$('#err').textContent='Digite os km rodados. Use um atalho se preferir.';break}
   if(st===2&&!s.min){$('#err').textContent='Escolha o tempo trabalhado.';break}
   if(st===3&&!s.buf[3]){$('#err').textContent='Digite o combustível ou toque em Estimar.';break}
   go(st===3?'regok':'reg'+(st+1));break;
  case'save':var b=s.buf[0]/100,c=s.buf[3]/100;S.undo={h:JSON.parse(JSON.stringify(S.hoje)),w:S.week};S.hoje.b+=b;S.hoje.c+=c;S.hoje.km+=+s.buf[1];S.hoje.min+=s.min;S.hoje.n+=1;S.week+=b-c;s.buf=['','','',''];s.min=0;go('home');toast('Registro salvo','Desfazer');break;
  case'undo':if(S.undo){S.hoje=S.undo.h;S.week=S.undo.w;S.undo=null}$('#toast').className='';toast('Registro desfeito');if(S.cur==='home'||S.cur==='toast')go('home',{keep:1});$('#toast').className='show';break;
  case'toast':toast(v);break;
  case'sim':S.sim=+v;go('plan');break;
  case'dep':var k=el.dataset.k,d=+v;if(d<0&&S.res[k]<20){toast('Saldo insuficiente em '+k);break}S.res[k]+=d;go('reservas');toast(d>0?'R$ 20 guardados em '+k:'R$ 20 retirados de '+k);break;
  case'cupom':S.cupom=!S.cupom;go('conta');break;
  case'closeov':closeOv();if(S.cur==='modal')go('priv');else if(S.cur==='tour')go('home');break;
  case'tournext':if(S.tour<2)openTour(S.tour+1);else{closeOv();go('home')}break;
  case'del':closeOv();go('welcome');toast('Conta excluída');break;
 }
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&$('#ov').className==='show'){closeOv();if(S.cur==='modal')go('priv');else if(S.cur==='tour')go('home')}
 else if(/^reg\d$/.test(S.cur)&&Q[S.reg.step].mode!=='time'&&!e.target.closest('select')){
  if(/^\d$/.test(e.key)){var b=document.querySelector('.kp [data-v="'+e.key+'"]');if(b)b.click()}
  else if(e.key==='Backspace'){var d=document.querySelector('.kp [data-v="d"]');if(d)d.click()}
 }
});
$('#fab').onclick=function(){go('reg0')};
var q=location.hash.slice(1);go(q&&R[q]||q&&draw(q)?q:'welcome');
</script>
