<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>FARO | Sem conexão</title>
  <style>
    :root{color-scheme:light}
    html,body{margin:0;min-height:100%;background:#FFFFFF;color:#0B1121;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{box-sizing:border-box;min-height:100dvh;display:grid;place-content:center;gap:12px;padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));text-align:center}
    h1{margin:0;font-size:22px}
    p{margin:0;font-size:16px;line-height:1.5;color:#475569;max-width:28rem}
.retry{box-sizing:border-box;justify-self:center;min-height:48px;display:inline-flex;align-items:center;padding:0 24px;border-radius:16px;background:#1D4ED8;color:#fff;font-weight:700;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .retry:active{transform:scale(.97)}
    .retry:focus-visible{outline:3px solid #0B1121;outline-offset:3px}
    @media (prefers-color-scheme:dark){html,body{background:#0B1121;color:#F8FAFC}p{color:#CBD5E1}}
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão</h1>
    <p>Seus dados continuam salvos neste aparelho. Conecte-se à internet e abra o FARO de novo.</p>
    <a class="retry" href="./">Tentar de novo</a>
  </main>
</body>
</html>
